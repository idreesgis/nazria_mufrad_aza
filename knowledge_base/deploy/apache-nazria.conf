# /etc/apache2/sites-available/nazria.conf  ->  sudo a2ensite nazria
# The Nazria API on port 95 (plain HTTP, the server's public IP): Apache -> gunicorn (Unix socket) -> Django.
# Needs: a2enmod proxy proxy_http headers expires rewrite, and "Listen 95" (deploy/apache-ports-95.conf).
# Other sites of this Apache (port 80, 443, ...) are not touched.
# Guide: deploy/DEPLOY_UBUNTU_APACHE.md

<VirtualHost *:95>
    # the only site on port 95, so it answers for any name or IP (Django checks the host: DJANGO_ALLOWED_HOSTS)
    ServerName nazria-api

    # pulse videos up to NAZRIA_PULSE_MAX_MB (100 MB) plus form overhead: 110 MB (also checked below)
    LimitRequestBody 115343360
    # pulse analysis and AI explanations can take up to a minute or two
    ProxyTimeout 180
    Timeout 180
    # receive the whole upload first, then pass it to gunicorn in one go (like nginx's request buffering): a slow
    # phone connection never ties up a gunicorn worker, and LimitRequestBody is enforced before Django sees it
    SetEnv proxy-sendcl 1
    # LimitRequestBody does not stop a proxied upload: refuse a too large one before it is received (413)
    RewriteEngine On
    RewriteCond %{HTTP:Content-Length} >115343360
    RewriteRule ^ - [R=413,L]

    # the client cannot choose the IP the audit log records: drop its own X-Forwarded-For, then mod_proxy adds
    # the real address (Django reads it with NAZRIA_TRUST_PROXY=true)
    RequestHeader unset X-Forwarded-For early
    RequestHeader set X-Forwarded-Proto "http"
    ProxyPreserveHost On
    ProxyAddHeaders On

    # Django sets these too: "set" replaces its copy instead of adding a second one
    Header set X-Content-Type-Options "nosniff"
    Header set X-Frame-Options "DENY"
    Header set Referrer-Policy "same-origin"
    Header unset X-Powered-By
    # do not tell the world which application server runs behind Apache
    Header unset Server

    # admin pages' CSS/JS (python manage.py collectstatic)
    Alias /static/ /var/lib/nazria/static/
    <Directory /var/lib/nazria/static>
        Require all granted
        Options -Indexes
        ExpiresActive On
        ExpiresDefault "access plus 7 days"
    </Directory>
    ProxyPass /static/ !

    # uploaded pulse videos are health data: never served by the web server
    ProxyPass /media/ !
    <Location /media/>
        Require all denied
    </Location>

    # everything else goes to gunicorn's socket (only the web server's group can open it)
    ProxyPass        / unix:/run/nazria/gunicorn.sock|http://nazria-api/ retry=0
    ProxyPassReverse / unix:/run/nazria/gunicorn.sock|http://nazria-api/

    ErrorLog ${APACHE_LOG_DIR}/nazria-error.log
    CustomLog ${APACHE_LOG_DIR}/nazria-access.log combined
</VirtualHost>
