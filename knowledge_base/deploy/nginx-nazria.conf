# /etc/nginx/sites-available/nazria  (link it into sites-enabled, remove the "default" site)
# Plain HTTP on the server's public IP, as chosen for now. For HTTPS see DEPLOY_UBUNTU.md, section "Later: HTTPS".
upstream nazria_api {
    server unix:/run/nazria/gunicorn.sock fail_timeout=0;
}

server {
    listen 80 default_server;
    # also on IPv6, if the server has it (nginx refuses to start when IPv6 is disabled):
    # listen [::]:80 default_server;
    server_name _;

    # pulse videos up to NAZRIA_PULSE_MAX_MB (100 MB) plus form overhead
    client_max_body_size 110m;
    client_body_timeout 120s;
    server_tokens off;

    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy same-origin always;

    # admin pages' CSS/JS (python manage.py collectstatic)
    location /static/ {
        alias /var/lib/nazria/static/;
        expires 7d;
        access_log off;
    }

    # uploaded pulse videos are health data: never served directly
    location /media/ {
        return 404;
    }

    location / {
        proxy_pass http://nazria_api;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_redirect off;
        # pulse analysis and AI explanations can take up to a minute or two
        proxy_read_timeout 180s;
        proxy_send_timeout 180s;
        proxy_request_buffering on;
    }
}
