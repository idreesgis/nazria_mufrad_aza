            type: string
            minLength: 1
            maxLength: 40
          description: Option keys of the "red_flags" question, e.g. ["none"]
          maxItems: 20
        complaint:
          type: string
          description: Free-text complaint, if already entered (also screened)
          maxLength: 1000
      required:
      - red_flags
  securitySchemes:
    jwtAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
