openapi: 3.0.3
info:
  title: Nazria Mufrad Aza API
  version: 2.0.0
  description: Patient accounts, symptom questionnaire, book-based assessment, pulse-video
    analysis and optional AI explanation for the Android app, with a complete audit
    log. Guidance only, not a diagnosis.
paths:
  /api/v1/auth/google/:
    post:
      operationId: v1_auth_google_create
      description: |-
        Sign in with Google. Send the ID token from Credential Manager / Google Sign-In.

        * A known Google account logs in (`200`, `created: false`).
        * An unknown one creates a patient account (`201`, `created: true`), which needs `consent: true`; without it the
          answer is `400 consent_required`: show the disclaimer and send the same request with `consent: true`.
        * Staff accounts cannot use Google: they log in with phone + password.
      tags:
      - v1
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GoogleLoginInRequest'
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GoogleTokensOut'
          description: ''
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GoogleTokensOut'
          description: ''
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorOut'
          description: ''
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorOut'
          description: ''
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorOut'
          description: ''
        '503':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorOut'
          description: ''
      parameters:
      - in: header
        name: X-Api-Key
        required: true
        schema:
          type: string
        description: App key (python manage.py create_api_client NAME)
  /api/v1/auth/login/:
    post:
      operationId: v1_auth_login_create
      description: 'Log in with phone + password: returns an access token (30 min)
        and a refresh token (30 days).'
      tags:
      - v1
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginInRequest'
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokensOut'
          description: ''
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorOut'
          description: ''
      parameters:
      - in: header
        name: X-Api-Key
        required: true
        schema:
          type: string
        description: App key (python manage.py create_api_client NAME)
  /api/v1/auth/logout/:
    post:
      operationId: v1_auth_logout_create
      description: Invalidate a refresh token (log out on this phone).
      tags:
      - v1
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RefreshInRequest'
        required: true
      security:
      - jwtAuth: []
      responses:
        '204':
          description: No response body
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorOut'
          description: ''
      parameters:
      - in: header
        name: X-Api-Key
        required: true
        schema:
          type: string
        description: App key (python manage.py create_api_client NAME)
  /api/v1/auth/refresh/:
    post:
      operationId: v1_auth_refresh_create
      description: New access + refresh tokens for a valid refresh token (the old
        refresh token stops working).
      tags:
      - v1
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RefreshInRequest'
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokensOut'
          description: ''
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorOut'
          description: ''
      parameters:
      - in: header
        name: X-Api-Key
        required: true
        schema:
          type: string
        description: App key (python manage.py create_api_client NAME)
  /api/v1/auth/register/:
    post:
      operationId: v1_auth_register_create
      description: Create a patient account (phone + password) and log in.
      tags:
      - v1
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterInRequest'
        required: true
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokensOut'
          description: ''
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorOut'
          description: ''
      parameters:
      - in: header
        name: X-Api-Key
        required: true
        schema:
          type: string
        description: App key (python manage.py create_api_client NAME)
  /api/v1/consultations/:
    get:
      operationId: v1_consultations_list
      description: |-
        GET: the account's diagnoses, newest first (?patient=<id> for one patient). POST: diagnose a patient: send all
        answers with either patient_id (an existing patient: re-diagnosis) or new_patient (their general info, asked
        first for a new patient). Returns the assessment (or the emergency referral), stored in the patient's history.
      parameters:
      - in: header
        name: X-Api-Key
        required: true
        schema:
          type: string
        description: App key (python manage.py create_api_client NAME)
      - name: page
        required: false
        in: query
        description: A page number within the paginated result set.
        schema:
          type: integer
      - in: query
        name: patient
        schema:
          type: string
          format: uuid
        description: only this patient
      tags:
      - v1
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedConsultationSummaryOutList'
          description: ''
    post:
      operationId: v1_consultations_create
      description: |-
        GET: the account's diagnoses, newest first (?patient=<id> for one patient). POST: diagnose a patient: send all
        answers with either patient_id (an existing patient: re-diagnosis) or new_patient (their general info, asked
        first for a new patient). Returns the assessment (or the emergency referral), stored in the patient's history.
      tags:
      - v1
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ConsultationRequestRequest'
        required: true
      security:
      - jwtAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConsultationOut'
          description: ''
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorOut'
          description: ''
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorOut'
          description: ''
        '503':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorOut'
          description: ''
      parameters:
      - in: header
        name: X-Api-Key
        required: true
        schema:
          type: string
        description: App key (python manage.py create_api_client NAME)
  /api/v1/consultations/{id}/:
    get:
      operationId: v1_consultations_retrieve
      description: One consultation. DELETE hides it from your history (everything
        is kept on the server).
      parameters:
      - in: header
        name: X-Api-Key
        required: true
        schema:
          type: string
        description: App key (python manage.py create_api_client NAME)
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - v1
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConsultationOut'
          description: ''
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorOut'
          description: ''
    delete:
      operationId: v1_consultations_destroy
      description: One consultation. DELETE hides it from your history (everything
        is kept on the server).
      parameters:
      - in: header
        name: X-Api-Key
        required: true
        schema:
          type: string
        description: App key (python manage.py create_api_client NAME)
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - v1
      security:
      - jwtAuth: []
      responses:
        '204':
          description: No response body
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorOut'
          description: ''
  /api/v1/consultations/{id}/explanation/:
    post:
      operationId: v1_consultations_explanation_create
      description: |-
        AI explanation of a completed result in plain Urdu, using only book passages (may take 10–30 s).
        Returns status "disabled" while the server runs with NAZRIA_ENGINE=questionnaire.
      parameters:
      - in: header
        name: X-Api-Key
        required: true
        schema:
          type: string
        description: App key (python manage.py create_api_client NAME)
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - v1
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExplanationOut'
          description: ''
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorOut'
          description: ''
        '409':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorOut'
          description: ''
        '429':
          description: too many explanation requests
  /api/v1/consultations/{id}/rediagnose/:
    post:
      operationId: v1_consultations_rediagnose_create
      description: |-
        Diagnose the same patient again from an earlier diagnosis: its answers are reused, the ones sent here replace
        them, and the patient's CURRENT general info and the current book are used. A new diagnosis is stored (linked by
        rediagnosis_of); the earlier one stays unchanged.
      parameters:
      - in: header
        name: X-Api-Key
        required: true
        schema:
          type: string
        description: App key (python manage.py create_api_client NAME)
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - v1
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RediagnoseRequestRequest'
      security:
      - jwtAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConsultationOut'
          description: ''
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorOut'
          description: ''
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorOut'
          description: ''
  /api/v1/health/:
    get:
      operationId: v1_health_retrieve
      description: Liveness and database check (no API key needed).
      tags:
      - v1
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthOut'
          description: ''
        '503':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthOut'
          description: ''
  /api/v1/me/:
    get:
      operationId: v1_me_retrieve
      description: The logged-in user's profile; PATCH changes name, gender or birth
        year.
      tags:
      - v1
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProfileOut'
          description: ''
      parameters:
      - in: header
        name: X-Api-Key
        required: true
        schema:
          type: string
        description: App key (python manage.py create_api_client NAME)
    patch:
      operationId: v1_me_partial_update
      description: The logged-in user's profile; PATCH changes name, gender or birth
        year.
      tags:
      - v1
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedProfileInRequest'
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProfileOut'
          description: ''
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorOut'
          description: ''
      parameters:
      - in: header
        name: X-Api-Key
        required: true
        schema:
          type: string
        description: App key (python manage.py create_api_client NAME)
  /api/v1/me/activity/:
    get:
      operationId: v1_me_activity_list
      description: Everything this account did (logins, consultations, pulse uploads
        …), newest first.
      parameters:
      - in: header
        name: X-Api-Key
        required: true
        schema:
          type: string
        description: App key (python manage.py create_api_client NAME)
      - name: page
        required: false
        in: query
        description: A page number within the paginated result set.
        schema:
          type: integer
      tags:
      - v1
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedAuditEventOutList'
          description: ''
  /api/v1/me/google/:
    post:
      operationId: v1_me_google_create
      description: |-
        POST: link a Google account to the logged-in patient (then they can sign in with either).
        DELETE: unlink it; only allowed when the account also has a phone and password, so nobody is locked out.
      tags:
      - v1
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GoogleLinkInRequest'
        required: true
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProfileOut'
          description: ''
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorOut'
          description: ''
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorOut'
          description: ''
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorOut'
          description: ''
        '409':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorOut'
          description: ''
        '503':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorOut'
          description: ''
      parameters:
      - in: header
        name: X-Api-Key
        required: true
        schema:
          type: string
        description: App key (python manage.py create_api_client NAME)
    delete:
      operationId: v1_me_google_destroy
      description: |-
        POST: link a Google account to the logged-in patient (then they can sign in with either).
        DELETE: unlink it; only allowed when the account also has a phone and password, so nobody is locked out.
      tags:
      - v1
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProfileOut'
          description: ''
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorOut'
          description: ''
        '409':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorOut'
          description: ''
      parameters:
      - in: header
        name: X-Api-Key
        required: true
        schema:
          type: string
        description: App key (python manage.py create_api_client NAME)
  /api/v1/me/password/:
    post:
      operationId: v1_me_password_create
      description: Change the password (all other sessions keep working until their
        tokens expire).
      tags:
      - v1
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PasswordChangeInRequest'
        required: true
      security:
      - jwtAuth: []
      responses:
        '204':
          description: No response body
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorOut'
          description: ''
      parameters:
      - in: header
        name: X-Api-Key
        required: true
        schema:
          type: string
        description: App key (python manage.py create_api_client NAME)
  /api/v1/patients/:
    get:
      operationId: v1_patients_list
      description: 'GET: the account''s patients (search by name). POST: add a patient
        (general info + consent).'
      parameters:
      - in: header
        name: X-Api-Key
        required: true
        schema:
          type: string
        description: App key (python manage.py create_api_client NAME)
      - name: page
        required: false
        in: query
        description: A page number within the paginated result set.
        schema:
          type: integer
      - in: query
        name: search
        schema:
          type: string
        description: part of the name
      tags:
      - v1
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedPatientOutList'
          description: ''
    post:
      operationId: v1_patients_create
      description: 'GET: the account''s patients (search by name). POST: add a patient
        (general info + consent).'
      tags:
      - v1
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatientInRequest'
        required: true
      security:
      - jwtAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PatientOut'
          description: ''
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorOut'
          description: ''
      parameters:
      - in: header
        name: X-Api-Key
        required: true
        schema:
          type: string
        description: App key (python manage.py create_api_client NAME)
  /api/v1/patients/{id}/:
    get:
      operationId: v1_patients_retrieve
      description: |-
        One patient with their diagnoses and pulse analyses. PATCH updates the general info (every change is kept in
        /history/). DELETE hides the patient from the account; everything is kept.
      parameters:
      - in: header
        name: X-Api-Key
        required: true
        schema:
          type: string
        description: App key (python manage.py create_api_client NAME)
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - v1
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PatientOut'
          description: ''
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorOut'
          description: ''
    patch:
      operationId: v1_patients_partial_update
      description: |-
        One patient with their diagnoses and pulse analyses. PATCH updates the general info (every change is kept in
        /history/). DELETE hides the patient from the account; everything is kept.
      parameters:
      - in: header
        name: X-Api-Key
        required: true
        schema:
          type: string
        description: App key (python manage.py create_api_client NAME)
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - v1
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedPatientInRequest'
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PatientOut'
          description: ''
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorOut'
          description: ''
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorOut'
          description: ''
    delete:
      operationId: v1_patients_destroy
      description: |-
        One patient with their diagnoses and pulse analyses. PATCH updates the general info (every change is kept in
        /history/). DELETE hides the patient from the account; everything is kept.
      parameters:
      - in: header
        name: X-Api-Key
        required: true
        schema:
          type: string
        description: App key (python manage.py create_api_client NAME)
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - v1
      security:
      - jwtAuth: []
      responses:
        '204':
          description: No response body
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorOut'
          description: ''
  /api/v1/patients/{id}/history/:
    get:
      operationId: v1_patients_history_list
      description: Every change to the patient's general info, newest first (who,
        when, which fields, the info after it).
      parameters:
      - in: header
        name: X-Api-Key
        required: true
        schema:
          type: string
        description: App key (python manage.py create_api_client NAME)
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        required: true
      - name: page
        required: false
        in: query
        description: A page number within the paginated result set.
        schema:
          type: integer
      tags:
      - v1
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedRevisionOutList'
          description: ''
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorOut'
          description: ''
  /api/v1/patients/intake-form/:
    get:
      operationId: v1_patients_intake_form_retrieve
      description: |-
        The general-info form to show before the first diagnosis of a NEW patient (Urdu labels, in order).
        Send the answers to POST /patients/ (or as "new_patient" in POST /consultations/).
      tags:
      - v1
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IntakeFormOut'
          description: ''
      parameters:
      - in: header
        name: X-Api-Key
        required: true
        schema:
          type: string
        description: App key (python manage.py create_api_client NAME)
  /api/v1/pulse/analyses/:
    get:
      operationId: v1_pulse_analyses_list
      description: |-
        GET: the account's pulse analyses, newest first (?patient=<id> for one patient). POST (multipart): upload a
        patient's video and analyse it (takes seconds).
      parameters:
      - in: header
        name: X-Api-Key
        required: true
        schema:
          type: string
        description: App key (python manage.py create_api_client NAME)
      - name: page
        required: false
        in: query
        description: A page number within the paginated result set.
        schema:
          type: integer
      - in: query
        name: patient
        schema:
          type: string
          format: uuid
        description: only this patient
      tags:
      - v1
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedPulseAnalysisOutList'
          description: ''
    post:
      operationId: v1_pulse_analyses_create
      description: |-
        GET: the account's pulse analyses, newest first (?patient=<id> for one patient). POST (multipart): upload a
        patient's video and analyse it (takes seconds).
      tags:
      - v1
      requestBody:
        content:
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PulseUploadInRequest'
        required: true
      security:
      - jwtAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PulseAnalysisOut'
          description: ''
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorOut'
          description: ''
      parameters:
      - in: header
        name: X-Api-Key
        required: true
        schema:
          type: string
        description: App key (python manage.py create_api_client NAME)
  /api/v1/pulse/analyses/{id}/:
    get:
      operationId: v1_pulse_analyses_retrieve
      description: One pulse analysis. DELETE hides it from your history (it is kept
        on the server).
      parameters:
      - in: header
        name: X-Api-Key
        required: true
        schema:
          type: string
        description: App key (python manage.py create_api_client NAME)
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - v1
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PulseAnalysisOut'
          description: ''
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorOut'
          description: ''
    delete:
      operationId: v1_pulse_analyses_destroy
      description: One pulse analysis. DELETE hides it from your history (it is kept
        on the server).
      parameters:
      - in: header
        name: X-Api-Key
        required: true
        schema:
          type: string
        description: App key (python manage.py create_api_client NAME)
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - v1
      security:
      - jwtAuth: []
      responses:
        '204':
          description: No response body
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorOut'
          description: ''
  /api/v1/pulse/symptom-suggestions/:
    get:
      operationId: v1_pulse_symptom_suggestions_retrieve
      description: Free-text symptom suggestions for the pulse upload screen (from
        the former pulse_diagnosis project).
      tags:
      - v1
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SymptomSuggestionsOut'
          description: ''
      parameters:
      - in: header
        name: X-Api-Key
        required: true
        schema:
          type: string
        description: App key (python manage.py create_api_client NAME)
  /api/v1/questionnaire/:
    get:
      operationId: v1_questionnaire_retrieve
      description: The questions and options the app shows, in order (as edited by
        a Hakeem in the database). No login needed.
      tags:
      - v1
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/QuestionnaireOut'
          description: ''
      parameters:
      - in: header
        name: X-Api-Key
        required: true
        schema:
          type: string
        description: App key (python manage.py create_api_client NAME)
  /api/v1/staff/accounts/:
    get:
      operationId: v1_staff_accounts_list
      description: All accounts (search by phone, name or e-mail), newest first.
      parameters:
      - in: header
        name: X-Api-Key
        required: true
        schema:
          type: string
        description: App key (python manage.py create_api_client NAME)
      - name: page
        required: false
        in: query
        description: A page number within the paginated result set.
        schema:
          type: integer
      - in: query
        name: search
        schema:
          type: string
        description: part of the phone number, name or e-mail
      tags:
      - v1
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedAccountRowOutList'
          description: ''
  /api/v1/staff/accounts/{id}/:
    get:
      operationId: v1_staff_accounts_retrieve
      description: 'One account: profile, its patients (hidden ones too), every consultation
        and pulse analysis.'
      parameters:
      - in: header
        name: X-Api-Key
        required: true
        schema:
          type: string
        description: App key (python manage.py create_api_client NAME)
      - in: path
        name: id
        schema:
          type: integer
        required: true
      tags:
      - v1
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: object
                additionalProperties: {}
          description: ''
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorOut'
          description: ''
  /api/v1/staff/audit/:
    get:
      operationId: v1_staff_audit_list
      description: The complete audit log (staff only).
      parameters:
      - in: header
        name: X-Api-Key
        required: true
        schema:
          type: string
        description: App key (python manage.py create_api_client NAME)
      - in: query
        name: action
        schema:
          type: string
        description: exact action, or a prefix ending in '.' (e.g. auth.)
      - in: query
        name: object_id
        schema:
          type: string
      - name: page
        required: false
        in: query
        description: A page number within the paginated result set.
        schema:
          type: integer
      - in: query
        name: since
        schema:
          type: string
        description: ISO date-time
      - in: query
        name: until
        schema:
          type: string
        description: ISO date-time
      - in: query
        name: user
        schema:
          type: integer
        description: actor user id
      tags:
      - v1
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedAuditEventOutList'
          description: ''
  /api/v1/staff/patients/:
    get:
      operationId: v1_staff_patients_list
      description: All patients of all accounts (search by patient name, or the account's
        phone, name or e-mail).
      parameters:
      - in: header
        name: X-Api-Key
        required: true
        schema:
          type: string
        description: App key (python manage.py create_api_client NAME)
      - name: page
        required: false
        in: query
        description: A page number within the paginated result set.
        schema:
          type: integer
      - in: query
        name: search
        schema:
          type: string
        description: patient name, or the account's phone, name or e-mail
      tags:
      - v1
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedStaffPatientRowOutList'
          description: ''
  /api/v1/staff/patients/{id}/:
    get:
      operationId: v1_staff_patients_retrieve
      description: 'One patient''s complete history: general info, every change to
        it, every diagnosis and pulse analysis.'
      parameters:
      - in: header
        name: X-Api-Key
        required: true
        schema:
          type: string
        description: App key (python manage.py create_api_client NAME)
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - v1
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: object
                additionalProperties: {}
          description: ''
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorOut'
          description: ''
  /api/v1/triage/:
    post:
      operationId: v1_triage_create
      description: |-
        Emergency check for the first answers. Call it after the red-flag question (and after the complaint).
        No login needed: an emergency must never wait for a login.
      tags:
      - v1
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TriageRequestRequest'
        required: true
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TriageOut'
          description: ''
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorOut'
          description: ''
      parameters:
      - in: header
        name: X-Api-Key
        required: true
        schema:
          type: string
        description: App key (python manage.py create_api_client NAME)
components:
  schemas:
    AccountRowOut:
      type: object
      properties:
        id:
          type: integer
        phone:
          type: string
          nullable: true
        email:
          type: string
        full_name:
          type: string
        created_at:
          type: string
          format: date-time
        last_login:
          type: string
          format: date-time
          nullable: true
        patients:
          type: integer
        consultations:
          type: integer
        pulse_analyses:
          type: integer
        is_active:
          type: boolean
      required:
      - consultations
      - created_at
      - email
      - full_name
      - id
      - is_active
      - last_login
      - patients
      - phone
      - pulse_analyses
    ActorTypeEnum:
      enum:
      - patient
      - hakeem
      - admin
      - anonymous
      type: string
      description: |-
        * `patient` - patient
        * `hakeem` - hakeem
        * `admin` - admin
        * `anonymous` - anonymous
    AssessmentOut:
      type: object
      properties:
        conclusive:
          type: boolean
          description: 'False: no clear tehreek, the patient needs a pulse examination'
        primary_system:
          type: string
          nullable: true
          description: In the response language
        primary_system_code:
          nullable: true
          oneOf:
          - $ref: '#/components/schemas/SystemCodeEnum'
          - $ref: '#/components/schemas/NullEnum'
        primary_organs:
          type: string
          nullable: true
        secondary_system:
          type: string
          nullable: true
        secondary_system_code:
          nullable: true
          oneOf:
          - $ref: '#/components/schemas/SystemCodeEnum'
          - $ref: '#/components/schemas/NullEnum'
        tehreek:
          type: string
          nullable: true
          description: In the response language
        tehreek_code:
          type: string
          nullable: true
          description: e.g. "muscular_glandular"
        mizaj:
          type: string
          nullable: true
        confidence:
          type: number
          format: double
        totals:
          type: object
          additionalProperties:
            type: integer
          description: '{"nervous": n, "muscular": n, "glandular": n}'
        evidence:
          type: array
          items:
            $ref: '#/components/schemas/EvidenceOut'
        vulnerable:
          type: boolean
          description: 'Child, elderly or pregnant: no recipe is ever returned'
      required:
      - conclusive
      - confidence
      - evidence
      - mizaj
      - primary_organs
      - primary_system
      - primary_system_code
      - secondary_system
      - secondary_system_code
      - tehreek
      - tehreek_code
      - totals
      - vulnerable
    AuditEventOut:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        at:
          type: string
          format: date-time
        request_id:
          type: string
          format: uuid
        actor:
          type: integer
          nullable: true
        actor_phone:
          type: string
        actor_type:
          $ref: '#/components/schemas/ActorTypeEnum'
        action:
          type: string
          description: e.g. consultation.create, auth.login_failed
          maxLength: 60
        object_type:
          type: string
          maxLength: 30
        object_id:
          type: string
          maxLength: 64
        method:
          type: string
          maxLength: 8
        path:
          type: string
          maxLength: 255
        status_code:
          type: integer
          maximum: 9223372036854775807
          minimum: 0
          format: int64
        duration_ms:
          type: integer
          maximum: 9223372036854775807
          minimum: 0
          format: int64
        ip:
          type: string
          nullable: true
        user_agent:
          type: string
          maxLength: 255
        details: {}
      required:
      - action
      - actor_type
      - duration_ms
      - id
      - method
      - path
      - request_id
      - status_code
    BlankEnum:
      enum:
      - ''
    BookOut:
      type: object
      properties:
        language:
          type: string
          description: 'Always "ur": book text is shown in the original Urdu'
        topic:
          allOf:
          - $ref: '#/components/schemas/TopicOut'
          nullable: true
        description:
          type: string
          nullable: true
        recipe:
          allOf:
          - $ref: '#/components/schemas/RecipeOut'
          nullable: true
        diet:
          type: string
          nullable: true
        passages:
          type: array
          items:
            $ref: '#/components/schemas/PassageOut'
          description: Only when no topic matched the complaint
      required:
      - description
      - diet
      - language
      - passages
      - recipe
      - topic
    ChronicConditionsEnum:
      enum:
      - diabetes
      - hypertension
      - heart
      - kidney
      - liver
      - asthma
      - thyroid
      - epilepsy
      - other
      - none
      type: string
      description: |-
        * `diabetes` - diabetes
        * `hypertension` - hypertension
        * `heart` - heart
        * `kidney` - kidney
        * `liver` - liver
        * `asthma` - asthma
        * `thyroid` - thyroid
        * `epilepsy` - epilepsy
        * `other` - other
        * `none` - none
    ConsultationOut:
      type: object
      properties:
        id:
          type: string
          format: uuid
        language:
          allOf:
          - $ref: '#/components/schemas/LanguageEnum'
          description: |-
            Language of the texts in this response

            * `ur` - ur
            * `en` - en
            * `ar` - ar
        direction:
          allOf:
          - $ref: '#/components/schemas/DirectionEnum'
          description: |-
            Text direction for that language

            * `rtl` - rtl
            * `ltr` - ltr
        account:
          type: integer
          description: User id of the account the patient belongs to
        patient:
          type: object
          additionalProperties: {}
          nullable: true
          description: The patient's general info AT THE TIME of this diagnosis (see
            PatientSnapshotOut); null only for an emergency without patient
        rediagnosis_of:
          type: string
          format: uuid
          nullable: true
          description: The earlier diagnosis this one re-ran
        prefilled_answers:
          type: object
          additionalProperties:
            type: string
          description: Answers the server took from the patient's info
        status:
          $ref: '#/components/schemas/ConsultationStatusEnum'
        created_at:
          type: string
          format: date-time
        emergency:
          allOf:
          - $ref: '#/components/schemas/EmergencyOut'
          nullable: true
        assessment:
          allOf:
          - $ref: '#/components/schemas/AssessmentOut'
          nullable: true
        book:
          allOf:
          - $ref: '#/components/schemas/BookOut'
          nullable: true
        diet_plans:
          type: array
          items:
            $ref: '#/components/schemas/DietPlanOut'
          description: One plan for the tehreek found; two (with choose_if) when only
            the dominant system is known; empty for an emergency or an inconclusive
            result
        advice:
          type: array
          items:
            type: string
        disclaimer:
          type: string
        text:
          type: string
          description: The whole result as Urdu text (same as the CLI), for simple
            display
        explanation:
          allOf:
          - $ref: '#/components/schemas/ExplanationOut'
          nullable: true
        explanation_available:
          type: boolean
          description: True when the server can explain this result with AI
        pulse_analyses:
          type: array
          items:
            $ref: '#/components/schemas/PulseSummaryOut'
        deleted:
          type: boolean
      required:
      - account
      - advice
      - assessment
      - book
      - created_at
      - deleted
      - diet_plans
      - direction
      - disclaimer
      - emergency
      - explanation
      - explanation_available
      - id
      - language
      - patient
      - prefilled_answers
      - pulse_analyses
      - rediagnosis_of
      - status
      - text
    ConsultationRequestRequest:
      type: object
      properties:
        answers:
          type: object
          additionalProperties: {}
          description: '{question_id: answer}. Single choice: option key; multiple
            choice: list of keys; text: string. Example: {"red_flags": ["none"], "complaint":
            "پرانی قبض", "duration": "chronic", ...}. The questions in the patient''s
            prefilled_questions may be left out: the server fills them.'
        patient_id:
          type: string
          format: uuid
          nullable: true
          description: An existing patient of this account (re-diagnosis)
        new_patient:
          type: object
          additionalProperties: {}
          nullable: true
          description: A new patient's general info (GET /patients/intake-form/),
            created together with this diagnosis
      required:
      - answers
    ConsultationStatusEnum:
      enum:
      - completed
      - emergency
      type: string
      description: |-
        * `completed` - completed
        * `emergency` - emergency
    ConsultationSummaryOut:
      type: object
      properties:
        id:
          type: string
          format: uuid
        status:
          $ref: '#/components/schemas/ConsultationStatusEnum'
        created_at:
          type: string
          format: date-time
        patient:
          allOf:
          - $ref: '#/components/schemas/PatientRefOut'
          nullable: true
        rediagnosis_of:
          type: string
          format: uuid
          nullable: true
        primary_system:
          type: string
          nullable: true
        primary_system_code:
          type: string
          nullable: true
        explanation_status:
          type: string
          nullable: true
        complaint:
          type: string
        deleted:
          type: boolean
          description: Hidden by the patient (only staff see these)
      required:
      - complaint
      - created_at
      - deleted
      - explanation_status
      - id
      - patient
      - primary_system
      - primary_system_code
      - rediagnosis_of
      - status
    DietPlanOut:
      type: object
      properties:
        tehreek:
          type: string
          description: The tehreek this plan is for, in the response language
        tehreek_code:
          type: string
        mizaj:
          type: string
        choose_if:
          type: string
          nullable: true
          description: 'Only when two plans are given (the tehreek is not certain):
            the feeling that tells the patient which plan applies'
        breakfast:
          type: array
          items:
            type: string
        lunch:
          type: array
          items:
            type: string
        dinner:
          type: array
          items:
            type: string
        fruits:
          type: array
          items:
            type: string
          description: 'Empty: fruits are not advised'
        dry_fruits:
          type: array
          items:
            type: string
          description: 'Empty: dry fruits are not advised'
        qehwa:
          $ref: '#/components/schemas/QehwaOut'
        rules:
          type: array
          items:
            type: string
        notes:
          type: array
          items:
            type: string
          description: From the patient's info (diabetes …)
      required:
      - breakfast
      - choose_if
      - dinner
      - dry_fruits
      - fruits
      - lunch
      - mizaj
      - notes
      - qehwa
      - rules
      - tehreek
      - tehreek_code
    DirectionEnum:
      enum:
      - rtl
      - ltr
      type: string
      description: |-
        * `rtl` - rtl
        * `ltr` - ltr
    EmergencyOut:
      type: object
      properties:
        flags:
          type: array
          items:
            type: string
        flag_labels:
          type: array
          items:
            type: string
        message:
          type: string
      required:
      - flag_labels
      - flags
      - message
    ErrorOut:
      type: object
      properties:
        error:
          type: string
        detail:
          type: string
        fields:
          type: object
          additionalProperties:
            type: string
      required:
      - detail
      - error
    EvidenceOut:
      type: object
      properties:
        question_id:
          type: string
        option_key:
          type: string
        question:
          type: string
        answer:
          type: string
        system:
          type: string
          description: The system this symptom points to, in the response language
        system_code:
          $ref: '#/components/schemas/SystemCodeEnum'
      required:
      - answer
      - option_key
      - question
      - question_id
      - system
      - system_code
    ExplanationOut:
      type: object
      properties:
        status:
          $ref: '#/components/schemas/ExplanationStatusEnum'
        text:
          type: string
          description: Only when status is shown
        reason:
          type: string
        retryable:
          type: boolean
        provider:
          type: string
        model:
          type: string
        external_provider:
          type: boolean
        notice:
          type: string
          nullable: true
          description: Show to the patient when an external AI service was used
        language:
          $ref: '#/components/schemas/LanguageEnum'
      required:
      - status
    ExplanationStatusEnum:
      enum:
      - shown
      - not_covered
      - rejected
      - unavailable
      - disabled
      type: string
      description: |-
        * `shown` - shown
        * `not_covered` - not_covered
        * `rejected` - rejected
        * `unavailable` - unavailable
        * `disabled` - disabled
    GenderEnum:
      enum:
      - male
      - female
      - other
      type: string
      description: |-
        * `male` - male
        * `female` - female
        * `other` - other
    GoogleLinkInRequest:
      type: object
      properties:
        id_token:
          type: string
          writeOnly: true
          minLength: 1
          maxLength: 4096
      required:
      - id_token
    GoogleLoginInRequest:
      type: object
      properties:
        id_token:
          type: string
          writeOnly: true
          minLength: 1
          description: Google ID token from Credential Manager / Google Sign-In (serverClientId
            = the server's Web client ID)
          maxLength: 4096
        consent:
          type: boolean
          default: false
          description: Needed (true) only when a new account is created
        full_name:
          type: string
          description: 'New accounts: defaults to the Google name'
          maxLength: 150
        gender:
          oneOf:
          - $ref: '#/components/schemas/GenderEnum'
          - $ref: '#/components/schemas/BlankEnum'
        birth_year:
          type: integer
          maximum: 2100
          minimum: 1900
          nullable: true
        language:
          allOf:
          - $ref: '#/components/schemas/LanguageEnum'
          description: |-
            Language of the app's texts: ur | en | ar

            * `ur` - ur
            * `en` - en
            * `ar` - ar
      required:
      - id_token
    GoogleTokensOut:
      type: object
      properties:
        access:
          type: string
          description: 'Send as Authorization: Bearer <access> (valid 30 minutes)'
        refresh:
          type: string
          description: Exchange at /auth/refresh/ for new tokens (valid 30 days)
        user:
          $ref: '#/components/schemas/ProfileOut'
        created:
          type: boolean
          description: True when this sign-in created a new account
      required:
      - access
      - created
      - refresh
      - user
    HazardOut:
      type: object
      properties:
        code:
          type: string
        name:
          type: string
      required:
      - code
      - name
    HealthOut:
      type: object
      properties:
        status:
          type: string
        database:
          type: string
        explanation_enabled:
          type: boolean
        google_login_enabled:
          type: boolean
          description: Show the "Sign in with Google" button
        api_version:
          type: integer
      required:
      - api_version
      - database
      - explanation_enabled
      - google_login_enabled
      - status
    IntakeFieldOut:
      type: object
      properties:
        id:
          type: string
        kind:
          $ref: '#/components/schemas/IntakeFieldOutKindEnum'
        required:
          type: boolean
        label:
          type: string
        options:
          type: array
          items:
            type: object
            additionalProperties:
              type: string
        min:
          type: number
          format: double
        max:
          type: number
          format: double
        max_length:
          type: integer
        help:
          type: string
      required:
      - id
      - kind
      - label
      - required
    IntakeFieldOutKindEnum:
      enum:
      - text
      - single
      - multi
