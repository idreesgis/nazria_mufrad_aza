openapi: 3.0.3
info:
  title: Nazria Mufrad Aza API
  version: 2.0.0
  description: Patient accounts, symptom questionnaire, book-based assessment, pulse-video
    analysis and optional AI explanation for the Android app, with a complete audit
    log. Guidance only, not a diagnosis.
paths:
  /api/v1/auth/login/:
    post:
      operationId: v1_auth_login_create
      description: 'Log in with phone + password: returns an access token (30 min)
        and a refresh token (30 days).'
      tags:
      - v1
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginInRequest'
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokensOut'
          description: ''
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorOut'
          description: ''
      parameters:
      - in: header
        name: X-Api-Key
        required: true
        schema:
          type: string
        description: App key (python manage.py create_api_client NAME)
  /api/v1/auth/logout/:
    post:
      operationId: v1_auth_logout_create
      description: Invalidate a refresh token (log out on this phone).
      tags:
      - v1
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RefreshInRequest'
        required: true
      security:
      - jwtAuth: []
      responses:
        '204':
          description: No response body
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorOut'
          description: ''
      parameters:
      - in: header
        name: X-Api-Key
        required: true
        schema:
          type: string
        description: App key (python manage.py create_api_client NAME)
  /api/v1/auth/refresh/:
    post:
      operationId: v1_auth_refresh_create
      description: New access + refresh tokens for a valid refresh token (the old
        refresh token stops working).
      tags:
      - v1
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RefreshInRequest'
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokensOut'
          description: ''
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorOut'
          description: ''
      parameters:
      - in: header
        name: X-Api-Key
        required: true
        schema:
          type: string
        description: App key (python manage.py create_api_client NAME)
  /api/v1/auth/register/:
    post:
      operationId: v1_auth_register_create
      description: Create a patient account (phone + password) and log in.
      tags:
      - v1
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterInRequest'
        required: true
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokensOut'
          description: ''
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorOut'
          description: ''
      parameters:
      - in: header
        name: X-Api-Key
        required: true
        schema:
          type: string
        description: App key (python manage.py create_api_client NAME)
  /api/v1/consultations/:
    get:
      operationId: v1_consultations_list
      description: |-
        GET: your consultation history, newest first. POST: submit all answers and get the assessment
        (or the emergency referral); it is stored in your history.
      parameters:
      - in: header
        name: X-Api-Key
        required: true
        schema:
          type: string
        description: App key (python manage.py create_api_client NAME)
      - name: page
        required: false
        in: query
        description: A page number within the paginated result set.
        schema:
          type: integer
      tags:
      - v1
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedConsultationSummaryOutList'
          description: ''
    post:
      operationId: v1_consultations_create
      description: |-
        GET: your consultation history, newest first. POST: submit all answers and get the assessment
        (or the emergency referral); it is stored in your history.
      tags:
      - v1
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ConsultationRequestRequest'
        required: true
      security:
      - jwtAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConsultationOut'
          description: ''
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorOut'
          description: ''
        '503':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorOut'
          description: ''
      parameters:
      - in: header
        name: X-Api-Key
        required: true
        schema:
          type: string
        description: App key (python manage.py create_api_client NAME)
  /api/v1/consultations/{id}/:
    get:
      operationId: v1_consultations_retrieve
      description: One consultation. DELETE hides it from your history (everything
        is kept on the server).
      parameters:
      - in: header
        name: X-Api-Key
        required: true
        schema:
          type: string
        description: App key (python manage.py create_api_client NAME)
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - v1
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConsultationOut'
          description: ''
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorOut'
          description: ''
    delete:
      operationId: v1_consultations_destroy
      description: One consultation. DELETE hides it from your history (everything
        is kept on the server).
      parameters:
      - in: header
        name: X-Api-Key
        required: true
        schema:
          type: string
        description: App key (python manage.py create_api_client NAME)
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - v1
      security:
      - jwtAuth: []
      responses:
        '204':
          description: No response body
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorOut'
          description: ''
  /api/v1/consultations/{id}/explanation/:
    post:
      operationId: v1_consultations_explanation_create
      description: |-
        AI explanation of a completed result in plain Urdu, using only book passages (may take 10–30 s).
        Returns status "disabled" while the server runs with NAZRIA_ENGINE=questionnaire.
      parameters:
      - in: header
        name: X-Api-Key
        required: true
        schema:
          type: string
        description: App key (python manage.py create_api_client NAME)
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - v1
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExplanationOut'
          description: ''
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorOut'
          description: ''
        '409':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorOut'
          description: ''
        '429':
          description: too many explanation requests
  /api/v1/health/:
    get:
      operationId: v1_health_retrieve
      description: Liveness and database check (no API key needed).
      tags:
      - v1
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthOut'
          description: ''
        '503':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthOut'
          description: ''
  /api/v1/me/:
    get:
      operationId: v1_me_retrieve
      description: The logged-in user's profile; PATCH changes name, gender or birth
        year.
      tags:
      - v1
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProfileOut'
          description: ''
      parameters:
      - in: header
        name: X-Api-Key
        required: true
        schema:
          type: string
        description: App key (python manage.py create_api_client NAME)
    patch:
      operationId: v1_me_partial_update
      description: The logged-in user's profile; PATCH changes name, gender or birth
        year.
      tags:
      - v1
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedProfileInRequest'
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProfileOut'
          description: ''
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorOut'
          description: ''
      parameters:
      - in: header
        name: X-Api-Key
        required: true
        schema:
          type: string
        description: App key (python manage.py create_api_client NAME)
  /api/v1/me/activity/:
    get:
      operationId: v1_me_activity_list
      description: Everything this account did (logins, consultations, pulse uploads
        …), newest first.
      parameters:
      - in: header
        name: X-Api-Key
        required: true
        schema:
          type: string
        description: App key (python manage.py create_api_client NAME)
      - name: page
        required: false
        in: query
        description: A page number within the paginated result set.
        schema:
          type: integer
      tags:
      - v1
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedAuditEventOutList'
          description: ''
  /api/v1/me/password/:
    post:
      operationId: v1_me_password_create
      description: Change the password (all other sessions keep working until their
        tokens expire).
      tags:
      - v1
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PasswordChangeInRequest'
        required: true
      security:
      - jwtAuth: []
      responses:
        '204':
          description: No response body
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorOut'
          description: ''
      parameters:
      - in: header
        name: X-Api-Key
        required: true
        schema:
          type: string
        description: App key (python manage.py create_api_client NAME)
  /api/v1/pulse/analyses/:
    get:
      operationId: v1_pulse_analyses_list
      description: 'GET: your pulse analyses, newest first. POST (multipart): upload
        a video and analyse it (takes seconds).'
      parameters:
      - in: header
        name: X-Api-Key
        required: true
        schema:
          type: string
        description: App key (python manage.py create_api_client NAME)
      - name: page
        required: false
        in: query
        description: A page number within the paginated result set.
        schema:
          type: integer
      tags:
      - v1
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedPulseAnalysisOutList'
          description: ''
    post:
      operationId: v1_pulse_analyses_create
      description: 'GET: your pulse analyses, newest first. POST (multipart): upload
        a video and analyse it (takes seconds).'
      tags:
      - v1
      requestBody:
        content:
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PulseUploadInRequest'
        required: true
      security:
      - jwtAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PulseAnalysisOut'
          description: ''
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorOut'
          description: ''
      parameters:
      - in: header
        name: X-Api-Key
        required: true
        schema:
          type: string
        description: App key (python manage.py create_api_client NAME)
  /api/v1/pulse/analyses/{id}/:
    get:
      operationId: v1_pulse_analyses_retrieve
      description: One pulse analysis. DELETE hides it from your history (it is kept
        on the server).
      parameters:
      - in: header
        name: X-Api-Key
        required: true
        schema:
          type: string
        description: App key (python manage.py create_api_client NAME)
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - v1
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PulseAnalysisOut'
          description: ''
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorOut'
          description: ''
    delete:
      operationId: v1_pulse_analyses_destroy
      description: One pulse analysis. DELETE hides it from your history (it is kept
        on the server).
      parameters:
      - in: header
        name: X-Api-Key
        required: true
        schema:
          type: string
        description: App key (python manage.py create_api_client NAME)
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - v1
      security:
      - jwtAuth: []
      responses:
        '204':
          description: No response body
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorOut'
          description: ''
  /api/v1/pulse/symptom-suggestions/:
    get:
      operationId: v1_pulse_symptom_suggestions_retrieve
      description: Free-text symptom suggestions for the pulse upload screen (from
        the former pulse_diagnosis project).
      tags:
      - v1
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SymptomSuggestionsOut'
          description: ''
      parameters:
      - in: header
        name: X-Api-Key
        required: true
        schema:
          type: string
        description: App key (python manage.py create_api_client NAME)
  /api/v1/questionnaire/:
    get:
      operationId: v1_questionnaire_retrieve
      description: The questions and options the app shows, in order (as edited by
        a Hakeem in the database). No login needed.
      tags:
      - v1
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/QuestionnaireOut'
          description: ''
      parameters:
      - in: header
        name: X-Api-Key
        required: true
        schema:
          type: string
        description: App key (python manage.py create_api_client NAME)
  /api/v1/staff/audit/:
    get:
      operationId: v1_staff_audit_list
      description: The complete audit log (staff only).
      parameters:
      - in: header
        name: X-Api-Key
        required: true
        schema:
          type: string
        description: App key (python manage.py create_api_client NAME)
      - in: query
        name: action
        schema:
          type: string
        description: exact action, or a prefix ending in '.' (e.g. auth.)
      - in: query
        name: object_id
        schema:
          type: string
      - name: page
        required: false
        in: query
        description: A page number within the paginated result set.
        schema:
          type: integer
      - in: query
        name: since
        schema:
          type: string
        description: ISO date-time
      - in: query
        name: until
        schema:
          type: string
        description: ISO date-time
      - in: query
        name: user
        schema:
          type: integer
        description: actor user id
      tags:
      - v1
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedAuditEventOutList'
          description: ''
  /api/v1/staff/patients/:
    get:
      operationId: v1_staff_patients_list
      description: All patients (search by phone or name), newest first.
      parameters:
      - in: header
        name: X-Api-Key
        required: true
        schema:
          type: string
        description: App key (python manage.py create_api_client NAME)
      - name: page
        required: false
        in: query
        description: A page number within the paginated result set.
        schema:
          type: integer
      - in: query
        name: search
        schema:
          type: string
        description: part of the phone number or name
      tags:
      - v1
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedPatientRowOutList'
          description: ''
  /api/v1/staff/patients/{id}/:
    get:
      operationId: v1_staff_patients_retrieve
      description: 'One patient''s complete history: profile, every consultation (hidden
        ones too) and pulse analysis.'
      parameters:
      - in: header
        name: X-Api-Key
        required: true
        schema:
          type: string
        description: App key (python manage.py create_api_client NAME)
      - in: path
        name: id
        schema:
          type: integer
        required: true
      tags:
      - v1
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: object
                additionalProperties: {}
          description: ''
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorOut'
          description: ''
  /api/v1/triage/:
    post:
      operationId: v1_triage_create
      description: |-
        Emergency check for the first answers. Call it after the red-flag question (and after the complaint).
        No login needed: an emergency must never wait for a login.
      tags:
      - v1
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TriageRequestRequest'
        required: true
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TriageOut'
          description: ''
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorOut'
          description: ''
      parameters:
      - in: header
        name: X-Api-Key
        required: true
        schema:
          type: string
        description: App key (python manage.py create_api_client NAME)
components:
  schemas:
    ActorTypeEnum:
      enum:
      - patient
      - hakeem
      - admin
      - anonymous
      type: string
      description: |-
        * `patient` - patient
        * `hakeem` - hakeem
        * `admin` - admin
        * `anonymous` - anonymous
    AssessmentOut:
      type: object
      properties:
        conclusive:
          type: boolean
          description: 'False: no clear tehreek, the patient needs a pulse examination'
        primary_system:
          type: string
          nullable: true
          description: اعصابی | عضلاتی | غدی
        primary_organs:
          type: string
          nullable: true
        secondary_system:
          type: string
          nullable: true
        tehreek:
          type: string
          nullable: true
        mizaj:
          type: string
          nullable: true
        confidence:
          type: number
          format: double
        totals:
          type: object
          additionalProperties:
            type: integer
        evidence:
          type: array
          items:
            $ref: '#/components/schemas/EvidenceOut'
        vulnerable:
          type: boolean
          description: 'Child, elderly or pregnant: no recipe is ever returned'
      required:
      - conclusive
      - confidence
      - evidence
      - mizaj
      - primary_organs
      - primary_system
      - secondary_system
      - tehreek
      - totals
      - vulnerable
    AuditEventOut:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        at:
          type: string
          format: date-time
        request_id:
          type: string
          format: uuid
        actor:
          type: integer
          nullable: true
        actor_phone:
          type: string
        actor_type:
          $ref: '#/components/schemas/ActorTypeEnum'
        action:
          type: string
          description: e.g. consultation.create, auth.login_failed
          maxLength: 60
        object_type:
          type: string
          maxLength: 30
        object_id:
          type: string
          maxLength: 64
        method:
          type: string
          maxLength: 8
        path:
          type: string
          maxLength: 255
        status_code:
          type: integer
          maximum: 9223372036854775807
          minimum: 0
          format: int64
        duration_ms:
          type: integer
          maximum: 9223372036854775807
          minimum: 0
          format: int64
        ip:
          type: string
          nullable: true
        user_agent:
          type: string
          maxLength: 255
        details: {}
      required:
      - action
      - actor_type
      - duration_ms
      - id
      - method
      - path
      - request_id
      - status_code
    BlankEnum:
      enum:
      - ''
    BookOut:
      type: object
      properties:
        topic:
          allOf:
          - $ref: '#/components/schemas/TopicOut'
          nullable: true
        description:
          type: string
          nullable: true
        recipe:
          allOf:
          - $ref: '#/components/schemas/RecipeOut'
          nullable: true
        diet:
          type: string
          nullable: true
        passages:
          type: array
          items:
            $ref: '#/components/schemas/PassageOut'
          description: Only when no chapter matched the complaint
      required:
      - description
      - diet
      - passages
      - recipe
      - topic
    CitationOut:
      type: object
      properties:
        volume:
          type: integer
        volume_name:
          type: string
        pages:
          type: array
          items:
            type: integer
        text:
          type: string
          description: Ready-made Urdu reference, e.g. "جلد دوم، صفحہ 127"
      required:
      - pages
      - text
      - volume
      - volume_name
    ConsultationOut:
      type: object
      properties:
        id:
          type: string
          format: uuid
        patient:
          type: integer
          description: User id of the patient
        status:
          $ref: '#/components/schemas/ConsultationStatusEnum'
        created_at:
          type: string
          format: date-time
        emergency:
          allOf:
          - $ref: '#/components/schemas/EmergencyOut'
          nullable: true
        assessment:
          allOf:
          - $ref: '#/components/schemas/AssessmentOut'
          nullable: true
        book:
          allOf:
          - $ref: '#/components/schemas/BookOut'
          nullable: true
        advice:
          type: array
          items:
            type: string
        disclaimer:
          type: string
        text:
          type: string
          description: The whole result as Urdu text (same as the CLI), for simple
            display
        explanation:
          allOf:
          - $ref: '#/components/schemas/ExplanationOut'
          nullable: true
        explanation_available:
          type: boolean
          description: True when the server can explain this result with AI
        pulse_analyses:
          type: array
          items:
            $ref: '#/components/schemas/PulseSummaryOut'
        deleted:
          type: boolean
      required:
      - advice
      - assessment
      - book
      - created_at
      - deleted
      - disclaimer
      - emergency
      - explanation
      - explanation_available
      - id
      - patient
      - pulse_analyses
      - status
      - text
    ConsultationRequestRequest:
      type: object
      properties:
        answers:
          type: object
          additionalProperties: {}
          description: '{question_id: answer}. Single choice: option key; multiple
            choice: list of keys; text: string. Example: {"red_flags": ["none"], "complaint":
            "پرانی قبض", "duration": "chronic", ...}'
      required:
